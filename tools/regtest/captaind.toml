# scuttle's Ark server (Bitcoin-Jungle/scuttle, built by build-services.py):
# expiry payouts on, the fee schedule proposed for mainnet, and the mainnet
# pool shape. Rounds every 10 seconds and few board confirmations, so tests
# do not wait. Public development credentials, as everywhere in this stack.
data_dir = "/data/captaind"
network = "regtest"
expiry_payouts = true
vtxo_lifetime = 4320
vtxo_exit_delta = 144
min_board_amount = "5000 sat"
required_board_confirmations = 3
min_trusted_confs = 2
round_interval = "10s"
round_submit_time = "2s"
round_sign_time = "2s"
htlc_expiry_delta = 40
htlc_send_expiry_delta = 1008
max_user_invoice_cltv_delta = 250
invoice_expiry = "48h"
receive_htlc_forward_timeout = "3min"
rpc_rich_errors = true
max_arkoor_fanout = 4
sync_manager_block_poll_interval = "100ms"
nursery_confirm_target_blocks = 6
otel_deployment_name = "bull-regtest"
max_read_mailbox_items = 100
recovery_xpub_nb_keys = 100000
max_concurrent_xpub_recoveries = 1
nb_round_nonces = 8
max_round_participation_outputs = 4
round_forfeit_nonces_timeout = "30s"
offboard_session_timeout = "30s"
offboard_max_locked_percent = 25
offboard_check_interval = "1s"
offboard_acceptable_fee_rate_duration = "15m"
cln_reconnect_interval = "10s"
invoice_check_interval = "3s"
cln_xpay_timeout = "60s"
cln_xpay_max_retry_for = "5m"
invoice_check_base_delay = "10s"
max_invoice_check_delay = "10m"
invoice_poll_interval = "30s"
htlc_settlement_poll_interval = "60s"
track_all_base_delay = "1s"
max_track_all_delay = "60s"
ln_receive_anti_dos_required = false
round_status_attestation_required = false
forfeit_attestation_required = false
ln_max_fee_ppm = 900000
max_vtxo_exit_depth = 100

[cln]
uri = "https://cln:9736"
server_cert_path = "/data/cln/regtest/ca.pem"
client_cert_path = "/data/cln/regtest/client.pem"
client_key_path = "/data/cln/regtest/client-key.pem"
hold_invoice.uri = "https://cln:9988"
hold_invoice.server_cert_path = "/data/cln/regtest/hold/ca.pem"
hold_invoice.client_cert_path = "/data/cln/regtest/hold/client.pem"
hold_invoice.client_key_path = "/data/cln/regtest/hold/client-key.pem"

# The fee schedule proposed for mainnet: percentages only. Same-server
# Lightning charges the sender half the external rate and the receiver
# nothing; arkoor sends and receives are free.
[fees.board]
min_fee_sat = 0
base_fee_sat = 0
ppm = 2000

[fees.offboard]
base_fee_sat = 0
fixed_additional_vb = 221
ppm_expiry_table = [
    { expiry_blocks_threshold = 0, ppm = 0 },
    { expiry_blocks_threshold = 1009, ppm = 2000 },
    { expiry_blocks_threshold = 1440, ppm = 3500 },
    { expiry_blocks_threshold = 2160, ppm = 5000 },
]

[fees.lightning_send]
min_fee_sat = 0
base_fee_sat = 0
ppm_expiry_table = [
    { expiry_blocks_threshold = 0, ppm = 0 },
    { expiry_blocks_threshold = 1009, ppm = 2000 },
    { expiry_blocks_threshold = 1440, ppm = 3500 },
    { expiry_blocks_threshold = 2160, ppm = 5000 },
]

[fees.lightning_receive]
base_fee_sat = 0
ppm = 2000

[fees.intra_ark.lightning_send]
min_fee_sat = 0
base_fee_sat = 0
ppm_expiry_table = [
    { expiry_blocks_threshold = 0, ppm = 0 },
    { expiry_blocks_threshold = 1009, ppm = 1000 },
    { expiry_blocks_threshold = 1440, ppm = 1750 },
    { expiry_blocks_threshold = 2160, ppm = 2500 },
]

[fees.intra_ark.lightning_receive]
base_fee_sat = 0
ppm = 0

[fees.refresh]
base_fee_sat = 0
ppm_expiry_table = [
    { expiry_blocks_threshold = 0, ppm = 1000 },
    { expiry_blocks_threshold = 289, ppm = 2000 },
    { expiry_blocks_threshold = 1009, ppm = 3000 },
    { expiry_blocks_threshold = 1440, ppm = 4500 },
    { expiry_blocks_threshold = 2160, ppm = 10000 },
    { expiry_blocks_threshold = 2880, ppm = 15000 },
    { expiry_blocks_threshold = 3600, ppm = 20000 },
]

# Pool VTXOs (what Lightning and same-server recipients get) live 1,008
# blocks and leave the pool with 432 left: 3 to 7 days before a payout.
[vtxopool]
vtxo_targets = [ "10000sat:40", "50000sat:40", "100000sat:40", "300000sat:20" ]
vtxo_target_issue_threshold = 80
vtxo_lifetime = 1008
vtxo_pre_expiry = 432
max_vtxo_exit_depth = 50

[fee_estimator]
update_interval = "1m"
history_duration = "60m"
fallback_fee_rate_fast = "5sat/vb"
fallback_fee_rate_regular = "2sat/vb"
fallback_fee_rate_slow = "1sat/vb"

[rpc]
public_address = "0.0.0.0:3535"
admin_address = "127.0.0.1:3536"
integration_address = "127.0.0.1:3537"

[postgres]
host = "ark-postgres"
port = 5432
name = "captaind"
user = "captaind"
password = "captaind"
max_connections = 10

[bitcoind]
url = "http://bitcoin:18443"
rpc_user = "admin1"
rpc_pass = "123"
