name: bull_payjoin
description: Pure-Dart Payjoin engine and public capability API for Bull Bitcoin.
publish_to: "none"
version: 0.1.0

environment:
  sdk: "3.14.0"

resolution: workspace

dependencies:
  bull_sdk:
    git:
      url: https://github.com/ethicnology-agent/bull_sdk
      ref: 1fac31fe9ed009cf0fee68061adaf902f14d15a1
      path: packages/bull_sdk
  crypto: ^3.0.7
  dio: ^5.9.0
  bull_sqlite:
  drift: ^2.35.4
  freezed_annotation: ^3.1.0
  meta: ^1.17.0
  # Source-build fork with hooks 2 and release-locked native dependencies.
  payjoin:
    git:
      url: https://github.com/ethicnology-agent/rust-payjoin
      ref: 0dbe3f781974c6c25d4e5314ca6d175e23ffcad6
      path: payjoin-ffi/dart
  primitives:
  sqlite3: ^3.5.2
  synchronized: ^3.4.0

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.35.3
  fake_async: ^1.3.3
  freezed: ^4.0.0
  lints: ^6.0.0
  mocktail: ^1.0.4
  test: ^1.26.3
