name: bull_payjoin
description: Pure-Dart Payjoin engine and public capability API for Bull Bitcoin.
publish_to: "none"
version: 0.1.0

environment:
  sdk: "3.12.2"

resolution: workspace

dependencies:
  bull_sdk:
    git:
      url: https://github.com/ethicnology-agent/bull_sdk
      ref: a661a1a67d6ab5488310f7f4154a2f055c70b57a
      path: packages/bull_sdk
  crypto: ^3.0.7
  dio: ^5.9.0
  drift: ^2.29.0
  freezed_annotation: ^3.1.0
  meta: ^1.17.0
  # Temporary source-build fork until hooks 2 is published on pub.dev.
  payjoin:
    git:
      url: https://github.com/ethicnology-agent/rust-payjoin
      ref: 06417f23bb623408d45805adcf2c8207f672be58
      path: payjoin-ffi/dart
  primitives:
  sqlite3: ^2.9.4
  synchronized: ^3.4.0

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.29.0
  fake_async: ^1.3.3
  freezed: ^3.2.3
  lints: ^6.0.0
  mocktail: ^1.0.4
  test: ^1.26.3
